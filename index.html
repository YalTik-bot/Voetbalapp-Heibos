<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a2c91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heibos">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K. Heibos S.V. Kalmthout – Opstelling</title>
<link rel="stylesheet" href="style.css?v=4"></head><body>
<header><label id="logo" title="Klik om je logo te kiezen"><span id="lt">K. Heibos S.V.<br>Kalmthout</span><input id="lf" type="file" accept="image/*" hidden></label>
<div><h1>K. Heibos S.V. Kalmthout</h1><small>Opstelling &amp; wedstrijdklok</small></div>
<button id="th" class="noprint" title="Donkere / lichte modus">🌙</button></header>

<div class="card noprint bar" id="bar">
 <div class="ck"><div id="clock">20:00</div><span id="per" class="hint"></span></div>
 <div class="btns">
  <button class="g" id="go" title="Start">▶<span class="tx"> Start</span></button><button class="o" id="pa" title="Pauze">⏸<span class="tx"> Pauze</span></button>
  <button class="o" id="rs" title="Reset wedstrijd">↺<span class="tx"> Reset wedstrijd</span></button><button id="pr" title="Printen">🖨<span class="tx"> Printen</span></button>
 </div>
</div>
<div class="hint noprint" style="margin-bottom:8px">Tik een positie op een veld en kies een speler. ⚽ = doelpunt. Met „⇄ Naar dit veld” zet je de klok op dat veld, ook terwijl ze loopt.</div>

<div id="tabs" class="noprint"></div>
<div id="fields"></div>

<div class="card" style="margin-top:12px"><b>Reservebank</b> <small>(namen aanpasbaar, worden bewaard)</small><div id="bench" style="margin-top:8px"></div></div>
<div class="card"><b>Doelpunten</b><table id="goals"></table></div>

<dialog id="pick" class="noprint"><div class="ph"><b id="pt"></b><button class="o" data-close="1">✕</button></div><div id="plist" tabindex="-1" autofocus></div></dialog>

<script src="app.js?v=4"></script></body></html>
