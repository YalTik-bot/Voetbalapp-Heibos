# Bij elke push en pull request: de app openen in een echte browser en alle tests uitvoeren
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Vast op 24.04: deze Playwright-versie ondersteunt nieuwere Ubuntu-versies nog niet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Testrapport bewaren als er iets misloopt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrapport
          path: playwright-report/
          retention-days: 14
